<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama & Alaa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quintessential&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sama.css">
</head>
<body>
    <audio autoplay loop id="bg-audio">
  <source src="bgmusic.mp3" type="audio/mpeg">
</audio>

    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="logo"><img src="logo1.png" alt=""></div>

    <div class="head fade-item">Ali & Jana</div>
    
    <div class="subhead fade-item">Are getting engaged!</div>
    
    
    <div class="env-container fade-item">
        <div class="interactive-wrapper" id="interactiveWrapper">
            
            <div class="envelope-box" id="envelopeBox">
                <img src="ll.png" alt="envelope" class="envelope-img">
                <div class="open-text">Click to Open....</div>
            </div>
            
            
            <div class="video-box" id="videoBox">
                <video id="invitationVideo" playsinline muted>
                    <source src="en1.mp4" type="video/mp4">
                </video>
            </div>

            <div class="details-section" id="detailsSection">
                <div class="save">Save the Date</div>
                <div class="date-row">
                    <span class="date fade-item">8</span>
                    <span class="date1 fade-item">June</span>
                    <span class="date2 fade-item">2027</span>
                </div>
                <div class="bar"><img src="bar2.png" alt=""></div>
                <div class="venue">Venue</div>
                <div class="place"><img src="place3.png" alt=""></div>
                <div class="placetext">Royal Plaza </div>
                <div class="time">8 P.M - 12 P.M</div>
                <a class="location" href="https://www.google.com/maps/place/Royal+Plaza+Corniche+Al-Maadi/@29.9718429,30.9592428,11z/data=!4m10!1m2!2m1!1sroyal+plaza+maadi!3m6!1s0x14584705b675461d:0x2561ca271438e469!8m2!3d29.9733315!4d31.2349357!15sChFyb3lhbCBwbGF6YSBtYWFkaZIBDXdlZGRpbmdfdmVudWXgAQA!16s%2Fg%2F11hf6r39_z?entry=ttu&g_ep=EgoyMDI2MDUxMy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer">click for Location</a>

                <div class="countdown-container fade-item">
                    <div class="countdown-title">Days Left</div>
                    <div class="countdown-row">
                        <div class="countdown-box">
                            <span id="days">22</span>
                            <div class="label">Days</div>
                        </div>
                        <div class="countdown-box">
                            <span id="hours">11</span>
                            <div class="label">Hours</div>
                        </div>
                        <div class="countdown-box">
                            <span id="minutes">00</span>
                            <div class="label">Minutes</div>
                        </div>
                        <div class="countdown-box">
                            <span id="seconds">50</span>
                            <div class="label">Seconds</div>
                        </div>
                    </div>
                    
                </div>

            </div>

        </div>
    </div>
    
    
   
</body>
</html>
